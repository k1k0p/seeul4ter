<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar - SEE-U-L4TER</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <div class="brand">SEE-U-L4TER</div>
        </div>
    </header>

    <main class="page">
        <section class="hero">
            <h1>Criar conta</h1>
            <p>Regista-te para poderes cifrar e decifrar ficheiros.</p>
        </section>

        <section class="grid">
            <section class="card">
                <h2>Registo</h2>

                <form method="POST">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Escolhe uma password">

                    <button type="submit">Criar conta</button>
                </form>

                {% if error %}
                <div class="error"><p>{{ error }}</p></div>
                {% endif %}

                <div class="actions" style="margin-top:16px;">
                    <a href="{{ url_for('login_page') }}">Já tenho conta</a>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
