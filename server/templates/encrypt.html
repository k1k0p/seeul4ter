<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrar ficheiro - SEE-U-L4TER</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>SEE-U-L4TER</h1>
        <p class="subtitle">Cifrar ficheiro para uma data futura</p>

        <section class="card">
            <h2>Cifra AES-128-CBC</h2>

            <form method="POST" enctype="multipart/form-data">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="exemplo@email.com"
                >

                <label for="future_datetime">Data e hora futura</label>
                <input
                    type="datetime-local"
                    id="future_datetime"
                    name="future_datetime"
                    required
                >

                <label for="file">Ficheiro</label>
                <input
                    type="file"
                    id="file"
                    name="file"
                    required
                >

                <button type="submit">Cifrar ficheiro</button>
            </form>
        </section>

        <section class="card">
            <h2>Navegação</h2>
            <p><a href="{{ url_for('index') }}">Voltar à página principal</a></p>
        </section>

        {% if error %}
        <div class="error">
            <p>{{ error }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
